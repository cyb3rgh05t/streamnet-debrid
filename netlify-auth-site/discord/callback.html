<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord Authorization | StreamNet TV</title>
    <link rel="icon" href="/assets/streamnet-icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #0a0806;
        --card: #14100c;
        --accent: #5865f2;
        --text: #f5efe5;
        --muted: #a59c8e;
        --border: rgba(255, 245, 230, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 36px 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(88, 101, 242, 0.15);
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .icon svg {
        width: 32px;
        height: 32px;
        fill: currentColor;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .code-box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 12px;
        font-family: monospace;
        font-size: 15px;
        color: var(--accent);
        word-break: break-all;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <path
            d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"
          />
        </svg>
      </div>
      <h1 id="heading">Connecting to TV...</h1>
      <p id="message">
        Please wait while we complete the authorization with your TV.
      </p>
      <div id="code-container" style="display: none">
        <p style="margin-bottom: 8px">Your pairing code:</p>
        <div class="code-box" id="code-val"></div>
      </div>
    </div>

    <script>
      (async function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var state = params.get("state") || params.get("session");
        var error = params.get("error");
        var errorDesc = params.get("error_description");

        var heading = document.getElementById("heading");
        var message = document.getElementById("message");
        var codeContainer = document.getElementById("code-container");
        var codeVal = document.getElementById("code-val");

        if (error) {
          heading.textContent = "Authorization Failed";
          heading.style.color = "#ff8a76";
          message.textContent = errorDesc || error;
          return;
        }

        if (!code || !/^[A-Za-z0-9_-]{40,128}$/.test(state || "")) {
          heading.textContent = "No Code Received";
          message.textContent =
            "Discord did not return a valid pairing response.";
          return;
        }

        if (code) {
          codeVal.textContent = code;
        }

        // If we have a TV session ID (state), notify the backend
        if (state) {
          try {
            var response = await fetch(
              "/.netlify/functions/discord-auth-callback",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ device_code: state, code: code }),
              },
            );

            if (response.ok) {
              heading.textContent = "Discord Connected! 🎉";
              heading.style.color = "#6ee7a3";
              message.textContent =
                "Your TV has been authorized. You can close this tab now.";
              return;
            }
          } catch (e) {
            console.error(e);
          }
        }

        heading.textContent = "Could Not Reach Your TV";
        heading.style.color = "#ff8a76";
        message.textContent =
          "Return to StreamNet TV and scan the QR code again.";
      })();
    </script>
  </body>
</html>
