<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamNet TV – Cloud Account</title>
    <link rel="icon" href="/assets/streamnet-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #0f0d0b;
        --bg-2: #171311;
        --bg-3: #221b16;
        --card: #1c1713;
        --panel: #15110e;
        --field: #120f0c;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(229, 162, 9, 0.26);
        --text: #f4efe7;
        --muted: #b4a798;
        --muted-strong: #d6cabb;
        --accent-1: #e5a209;
        --accent-2: #ce8017;
        --accent-soft: rgba(229, 162, 9, 0.12);
        --field-focus: #1d1712;
        --ok: #6ee7a3;
        --danger: #ff8a76;
        --shadow: rgba(0, 0, 0, 0.42);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(229, 162, 9, 0.06),
            transparent 22%
          ),
          linear-gradient(160deg, var(--bg-1), var(--bg-2) 62%, var(--bg-3));
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: -0.01em;
        padding: 28px;
        min-height: 100vh;
      }

      .page {
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
        min-height: calc(100vh - 56px);
        display: grid;
        align-content: center;
        gap: 12px;
      }

      .topbar {
        display: flex;
        justify-content: flex-end;
      }

      .lang-switch {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px;
      }

      .lang-btn {
        border: 0;
        background: transparent;
        color: var(--muted);
        min-height: 34px;
        min-width: 54px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 0 12px;
        transition:
          color 0.2s ease,
          background 0.2s ease;
      }

      .lang-btn[aria-pressed="true"] {
        color: #17120f;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      }

      .lang-btn:hover {
        color: var(--text);
      }

      .shell {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(360px, 440px);
        border-radius: 28px;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.01),
            rgba(255, 255, 255, 0.01)
          ),
          var(--card);
        border: 1px solid var(--line);
        box-shadow:
          0 28px 70px -34px rgba(0, 0, 0, 0.86),
          0 8px 18px -12px var(--shadow);
        overflow: hidden;
        min-height: 700px;
      }

      .info {
        position: relative;
        padding: 40px 40px 34px;
        background:
          linear-gradient(180deg, rgba(229, 162, 9, 0.06), transparent 26%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.02), transparent 40%);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 26px;
      }

      .kicker {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-1);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
      .brand-logo {
        width: min(290px, 100%);
        height: auto;
        display: block;
      }

      .hero-copy {
        max-width: 520px;
      }

      .title {
        margin: 0;
        font-size: clamp(34px, 4vw, 48px);
        line-height: 1.02;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #fbf6ec;
      }

      .subtitle {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .summary-card,
      .pairing-card,
      .help-card {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 18px;
      }

      .summary-card {
        padding: 16px 16px 14px;
      }

      .summary-card strong {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        color: var(--muted-strong);
      }

      .summary-card span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .pairing-card {
        padding: 22px;
      }

      .section-title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
      }

      .section-copy {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .pairing-steps {
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }

      .pairing-steps li {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }

      .step-index {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        display: inline-grid;
        place-items: center;
        background: var(--accent-soft);
        color: var(--accent-1);
        font-size: 12px;
        font-weight: 700;
      }

      .step-copy {
        color: var(--muted-strong);
        font-size: 13px;
        line-height: 1.55;
      }

      .pairing-card[data-mode="default"] .pairing-state,
      .pairing-card[data-mode="pairing"] .pairing-default {
        display: none;
      }

      .help-card {
        padding: 18px 22px;
      }

      .help-list {
        margin: 12px 0 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .auth-panel {
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          transparent 22%
        );
      }

      .auth-card {
        width: 100%;
        background: #17120f;
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .head {
        padding: 28px 28px 20px;
        border-bottom: 1px solid var(--line);
      }

      .pair {
        display: none;
        margin-top: 14px;
        padding: 14px 15px;
        border-radius: 12px;
        border: 1px solid var(--line-strong);
        background: rgba(229, 162, 9, 0.08);
        color: var(--text);
        font-size: 13px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .pair-label {
        color: var(--muted);
        font-weight: 500;
      }
      .pair b {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.12em;
        font-size: 15px;
        color: #fbf6ec;
      }

      .body {
        padding: 20px 28px 26px;
      }

      .status {
        min-height: 19px;
        margin: 4px 0 10px;
        font-size: 13px;
        color: var(--muted);
        transition: color 0.2s ease;
      }
      .status.error {
        color: var(--danger);
      }
      .status.ok {
        color: var(--ok);
      }

      .label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 14px 0 6px;
        letter-spacing: 0.02em;
      }

      .input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        outline: none;
        background: var(--field);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        transition:
          border-color 0.18s ease,
          background 0.18s ease,
          box-shadow 0.18s ease;
      }
      .input::placeholder {
        color: #7e7164;
      }
      .input:hover {
        border-color: var(--line-strong);
      }
      .input:focus {
        border-color: rgba(229, 162, 9, 0.58);
        background: var(--field-focus);
        box-shadow: inset 0 0 0 1px rgba(229, 162, 9, 0.16);
      }

      .actions {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .btn {
        width: 100%;
        border: 1px solid var(--line-strong);
        background: rgba(255, 245, 230, 0.03);
        color: var(--text);
        border-radius: 12px;
        padding: 13px;
        font-weight: 600;
        font-family: inherit;
        font-size: 14px;
        letter-spacing: -0.005em;
        cursor: pointer;
        transition:
          transform 0.14s ease,
          background 0.2s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease;
      }
      .btn:hover {
        background: rgba(255, 245, 230, 0.07);
        border-color: rgba(255, 245, 230, 0.28);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .btn.primary {
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color: #0d0e12;
        border: 0;
        box-shadow: none;
      }
      .btn.primary:hover {
        background: linear-gradient(135deg, #efaf14, #d88419);
      }

      .small {
        margin-top: 16px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
        text-align: center;
      }

      .linkrow {
        margin-top: 10px;
        display: flex;
        justify-content: flex-end;
      }

      .linkbtn {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        padding: 4px 2px;
        transition: color 0.18s ease;
      }
      .linkbtn:hover {
        color: var(--text);
      }
      .linkbtn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .foot {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        text-align: center;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 500;
      }

      .privacy-link {
        display: block;
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        text-decoration: none;
      }

      .privacy-link:hover,
      .privacy-link:focus-visible {
        color: var(--text);
      }

      .mode-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        color: var(--muted-strong);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .mode-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent-1);
      }

      @media (max-width: 480px) {
        body {
          padding: 14px;
        }
        .page {
          gap: 10px;
          min-height: auto;
        }
        .shell {
          border-radius: 18px;
        }
        .topbar {
          justify-content: stretch;
        }
        .lang-switch {
          width: 100%;
          justify-content: center;
        }
        .head {
          padding: 20px 16px 16px;
        }
        .body {
          padding: 16px;
        }
        .info {
          padding: 20px 16px 18px;
          gap: 18px;
        }
        .pairing-card,
        .help-card {
          padding: 14px;
          border-radius: 14px;
        }
        .summary-card {
          padding: 12px;
          border-radius: 14px;
        }
        .pair {
          padding: 12px;
        }
        .pair b {
          font-size: 13px;
          letter-spacing: 0.08em;
          word-break: break-all;
        }
        .title {
          font-size: 30px;
        }
        .subtitle,
        .section-copy,
        .step-copy,
        .help-list {
          font-size: 13px;
          line-height: 1.55;
        }
        .btn {
          min-height: 46px;
        }
      }

      @media (max-width: 980px) {
        .page {
          align-content: start;
        }

        .shell {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .auth-panel {
          order: 1;
          padding: 16px;
        }

        .info {
          order: 2;
          padding: 26px 20px 22px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .summary {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .shell {
          border-radius: 20px;
        }
        .auth-panel {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <div class="lang-switch" role="group" aria-label="Language switch">
          <button
            class="lang-btn"
            id="langEn"
            type="button"
            aria-pressed="true"
          >
            EN
          </button>
          <button
            class="lang-btn"
            id="langDe"
            type="button"
            aria-pressed="false"
          >
            DE
          </button>
        </div>
      </div>

      <main class="shell">
        <section class="info">
          <div class="brand">
            <img
              class="brand-logo"
              src="/assets/streamnet-logo.svg"
              alt="StreamNet TV"
            />
          </div>

          <div class="hero-copy">
            <div class="kicker" data-i18n="hero.kicker"></div>
            <h1 class="title" data-i18n="hero.title"></h1>
            <p class="subtitle" id="subtitle"></p>
          </div>

          <div class="summary">
            <div class="summary-card">
              <strong data-i18n="summary.profiles.title"></strong>
              <span data-i18n="summary.profiles.copy"></span>
            </div>
            <div class="summary-card">
              <strong data-i18n="summary.playback.title"></strong>
              <span data-i18n="summary.playback.copy"></span>
            </div>
            <div class="summary-card">
              <strong data-i18n="summary.pairing.title"></strong>
              <span data-i18n="summary.pairing.copy"></span>
            </div>
          </div>

          <section class="pairing-card" id="pairingInfo" data-mode="default">
            <div class="pairing-default">
              <h2 class="section-title" data-i18n="pairing.defaultTitle"></h2>
              <p class="section-copy" data-i18n="pairing.defaultCopy"></p>
            </div>
            <div class="pairing-state">
              <div class="mode-tag">
                <span class="mode-dot"></span>
                <span data-i18n="pairing.activeTag"></span>
              </div>
              <h2
                class="section-title"
                style="margin-top: 14px"
                data-i18n="pairing.stateTitle"
              ></h2>
              <p class="section-copy" data-i18n="pairing.stateCopy"></p>
              <ol class="pairing-steps">
                <li>
                  <span class="step-index">1</span>
                  <span class="step-copy" data-i18n="pairing.steps.one"></span>
                </li>
                <li>
                  <span class="step-index">2</span>
                  <span class="step-copy" data-i18n="pairing.steps.two"></span>
                </li>
                <li>
                  <span class="step-index">3</span>
                  <span
                    class="step-copy"
                    data-i18n="pairing.steps.three"
                  ></span>
                </li>
              </ol>
            </div>
          </section>

          <section class="help-card">
            <h2 class="section-title" data-i18n="help.title"></h2>
            <ul class="help-list">
              <li data-i18n="help.items.one"></li>
              <li data-i18n="help.items.two"></li>
              <li data-i18n="help.items.three"></li>
            </ul>
          </section>
        </section>

        <section class="auth-panel">
          <div class="auth-card">
            <header class="head">
              <div class="kicker" data-i18n="auth.kicker"></div>
              <h2
                class="section-title"
                style="font-size: 28px; margin: 10px 0 0"
              >
                <span data-i18n="auth.title"></span>
              </h2>
              <div class="pair" id="pairBox">
                <span class="pair-label" data-i18n="auth.pairCode"></span>
                <b id="pairCode"></b>
              </div>
            </header>

            <section class="body">
              <div class="status" id="status"></div>

              <label
                class="label"
                for="email"
                id="emailLabel"
                data-i18n="labels.email"
              ></label>
              <input
                class="input"
                id="email"
                type="email"
                autocomplete="email"
                data-i18n-placeholder="placeholders.email"
              />

              <label
                class="label"
                for="password"
                id="passwordLabel"
                data-i18n="labels.password"
              ></label>
              <input
                class="input"
                id="password"
                type="password"
                autocomplete="current-password"
                data-i18n-placeholder="placeholders.password"
              />
              <div class="linkrow">
                <button
                  class="linkbtn"
                  id="forgot"
                  type="button"
                  data-i18n="actions.forgot"
                ></button>
              </div>

              <div class="actions">
                <button
                  class="btn primary"
                  id="signin"
                  data-i18n="actions.signIn"
                ></button>
                <button
                  class="btn"
                  id="signup"
                  data-i18n="actions.signUp"
                ></button>
                <button
                  class="btn"
                  id="savepass"
                  style="display: none"
                  data-i18n="actions.savePassword"
                ></button>
              </div>

              <p class="small" id="helperText"></p>
              <div class="foot" data-i18n="auth.foot"></div>
              <a
                class="privacy-link"
                href="/delete-account"
                data-i18n="auth.deleteAccount"
              ></a>
            </section>
          </div>
        </section>
      </main>
    </div>

      const storedLang = window.localStorage.getItem("arvio:lang");
      let currentLang = storedLang
        ? storedLang === "de"
          ? "de"
          : "en"
        : (navigator.language || "en").toLowerCase().startsWith("de")
          ? "de"
          : "en";

      function readKey(bundle, keyPath) {
        return keyPath.split(".").reduce((acc, part) => acc?.[part], bundle);
      }

      function t(keyPath, vars = {}) {
        const selected = I18N[currentLang] || I18N.en;
        const fallback = I18N.en;
        const raw =
          readKey(selected, keyPath) || readKey(fallback, keyPath) || keyPath;
        return String(raw).replace(/\{(\w+)\}/g, (_, name) =>
          vars[name] == null ? `{${name}}` : String(vars[name]),
        );
      }

      function renderStaticI18n() {
        document.documentElement.lang = currentLang;
        document.title = t("meta.title");
        langEnBtn.setAttribute("aria-pressed", String(currentLang === "en"));
        langDeBtn.setAttribute("aria-pressed", String(currentLang === "de"));

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const keyPath = el.getAttribute("data-i18n");
          if (keyPath) el.textContent = t(keyPath);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const keyPath = el.getAttribute("data-i18n-placeholder");
          if (keyPath) el.setAttribute("placeholder", t(keyPath));
        });
      }

        currentLang = lang === "de" ? "de" : "en";

      const EMAIL_RE = /^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,63}$/i;
      const BLOCKED_EMAIL_DOMAINS = new Set([
        "10minutemail.com",
        "20minutemail.com",
        "dispostable.com",
        "emailondeck.com",
        "example.com",
        "example.net",
        "example.org",
        "fakeinbox.com",
        "getnada.com",
        "grr.la",
        "guerrillamail.biz",
        "guerrillamail.de",
        "guerrillamail.info",
        "guerrillamail.org",
        "maildrop.cc",
        "moakt.com",
        "sharklasers.com",
        "tempmailo.com",
        "trashmail.com",
        "invalid",
        "localhost",
        "mailinator.com",
        "guerrillamail.com",
        "guerrillamail.net",
        "10minutemail.com",
        "tempmail.com",
        "temp-mail.org",
        "yopmail.com",
      ]);
      const BLOCKED_EMAIL_DOMAIN_FRAGMENTS = [
        "10minutemail",
        "disposable",
        "fakeinbox",
        "guerrillamail",
        "maildrop",
        "mailinator",
        "tempmail",
        "temp-mail",
        "trashmail",
        "yopmail",
      ];
      const BLOCKED_SIGNUP_LOCAL_PARTS = new Set([
        "asdf",
        "example",
        "fake",
        "invalid",
        "no-reply",
        "none",
        "noreply",
        "null",
        "qwerty",
        "test",
      ]);
      const EMAIL_SEND_COOLDOWN_MS = 5 * 60 * 1000;

      function normalizeEmail(value) {
        return String(value || "")
          .trim()
          .toLowerCase();
      }

      function validateEmail(value, rejectDisposable = true) {
        const email = normalizeEmail(value);
        if (!email) return t("errors.emailRequired");
        if (email.length > 254 || !EMAIL_RE.test(email))
          return t("errors.emailInvalid");
        if ((email.match(/@/g) || []).length !== 1)
          return t("errors.emailInvalid");

        const [localPart, domain = ""] = email.split("@");
        if (!localPart || !domain) return t("errors.emailReal");
        if (
          localPart.length > 64 ||
          localPart.startsWith(".") ||
          localPart.endsWith(".") ||
          localPart.includes("..")
        ) {
          return t("errors.emailInvalid");
        }

        const domainLabels = domain.split(".");
        if (
          domainLabels.length < 2 ||
          domainLabels.some((part) => !part || part.length > 63)
        ) {
          return t("errors.emailInvalid");
        }
        if (
          domainLabels.some(
            (part) => part.startsWith("-") || part.endsWith("-"),
          )
        ) {
          return t("errors.emailInvalid");
        }
        if (/^\d+$/.test(domainLabels[domainLabels.length - 1])) {
          return t("errors.emailInvalid");
        }

        const blockedDomain =
          BLOCKED_EMAIL_DOMAINS.has(domain) ||
          BLOCKED_EMAIL_DOMAIN_FRAGMENTS.some((fragment) =>
            domain.includes(fragment),
          );
        if (rejectDisposable && BLOCKED_SIGNUP_LOCAL_PARTS.has(localPart))
          return t("errors.emailReal");
        if (rejectDisposable && blockedDomain) return t("errors.emailReal");
        if (
          rejectDisposable &&
          (domain.endsWith(".example") ||
            domain.endsWith(".invalid") ||
            domain.endsWith(".localhost") ||
            domain.endsWith(".local") ||
            domain.endsWith(".test"))
        ) {
          return t("errors.emailReal");
        }
        return "";
      }

      function requireValidEmail(value, rejectDisposable = true) {
        const message = validateEmail(value, rejectDisposable);
        if (message) throw new Error(message);
        return normalizeEmail(value);
      }

      function emailSendCooldownKey(action, email) {
        return `arvio:${action}:${normalizeEmail(email)}`;
      }

      function assertEmailSendCooldown(action, email) {
        const key = emailSendCooldownKey(action, email);
        const last = Number(window.localStorage.getItem(key) || "0");
        const remaining = EMAIL_SEND_COOLDOWN_MS - (Date.now() - last);
        if (remaining > 0) {
          throw new Error(
            t("errors.waitCooldown", { seconds: Math.ceil(remaining / 1000) }),
          );
        }
      }

      function markEmailSent(action, email) {
        const key = emailSendCooldownKey(action, email);
        window.localStorage.setItem(key, String(Date.now()));
      }

      function applyRecoveryModeUi() {
        pairBox.style.display = "none";
        signInBtn.style.display = "none";
        signUpBtn.style.display = "none";
        forgotBtn.style.display = "none";

        pairBox.style.display = "flex";

        pairingInfoEl.dataset.mode = "pairing";

      if (isRecoveryMode || isPasswordSetupMode) applyRecoveryModeUi();

      langDeBtn.onclick = () => setLanguage("de");
      renderStaticI18n();
      renderModeCopy();

      async function approveTvViaServer(email, password) {
        if (!pairCode) return;
        const normalizedEmail = requireValidEmail(email, false);
        const resp = await fetch(`${FUNCTION_BASE}/tv-auth-web`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: APP_ANON_KEY,
            Authorization: `Bearer ${APP_ANON_KEY}`,
          },
          body: JSON.stringify({
            action: "signin",
            code: pairCode,
            email: normalizedEmail,
            password,
          }),
        });
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok)
          throw new Error(json.error || t("errors.tvPairingFailed"));
      }

      async function signUpAndPairViaServer(email, password) {
        if (!pairCode) return;
        const normalizedEmail = requireValidEmail(email);
        assertEmailSendCooldown("signup", normalizedEmail);
        const resp = await fetch(`${FUNCTION_BASE}/tv-auth-complete`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: APP_ANON_KEY,
            Authorization: `Bearer ${APP_ANON_KEY}`,
          },
          body: JSON.stringify({
            code: pairCode,
            email: normalizedEmail,
            password,
            intent: "signup",
          }),
        });
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok)
          throw new Error(
            json.error || t("errors.accountCreationPairingFailed"),
          );
        markEmailSent("signup", normalizedEmail);
      }

      async function createAccountViaServer(email, password) {
        const normalizedEmail = requireValidEmail(email);
        assertEmailSendCooldown("signup", normalizedEmail);
        const resp = await fetch(`${FUNCTION_BASE}/cloud-auth-email`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: APP_ANON_KEY,
            Authorization: `Bearer ${APP_ANON_KEY}`,
          },
          body: JSON.stringify({
            email: normalizedEmail,
            password,
          }),
        });
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok)
          throw new Error(json.error || t("errors.accountCreationFailed"));
        if (!json.access_token || !json.refresh_token) {
          throw new Error(t("errors.accountCreatedIncomplete"));
        }
        markEmailSent("signup", normalizedEmail);
        return normalizedEmail;
      }

      async function signInEmail() {
        const email = requireValidEmail(emailEl.value, false);
        const password = passEl.value;
        if (!password) throw new Error(t("errors.passwordRequired"));
        const resp = await fetch(`${FUNCTION_BASE}/auth-login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: APP_ANON_KEY,
            Authorization: `Bearer ${APP_ANON_KEY}`,
          },
          body: JSON.stringify({ email, password }),
        });
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          let setupHint = "";
          if (json.code === "password_setup_required") {
            if (json.email_sent) {
              setupHint = t("errors.setupHintMailSent");
            } else if (json.setup_error) {
              setupHint = t("errors.setupHintMailFailed", {
                setupError: json.setup_error,
              });
            } else {
              setupHint = t("errors.setupHintUseForgot");
            }
          }
          throw new Error((json.error || t("errors.signInFailed")) + setupHint);
        }
        return { email, password };
      }

      async function signUpEmail() {
        const email = requireValidEmail(emailEl.value);
        const password = passEl.value;
        if (!password) throw new Error(t("errors.passwordRequired"));
        if (password.length < 6) throw new Error(t("errors.passwordMin"));
        await createAccountViaServer(email, password);
      }

      async function sendPasswordReset() {
        const email = requireValidEmail(emailEl.value, false);
        assertEmailSendCooldown("reset", email);
        const resp = await fetch(`${FUNCTION_BASE}/cloud-auth-reset`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: APP_ANON_KEY,
            Authorization: `Bearer ${APP_ANON_KEY}`,
          },
          body: JSON.stringify({
            email,
          }),
        });
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok)
          throw new Error(json.error || t("errors.passwordResetFailed"));
        if (!json.account_exists) {
          throw new Error(t("errors.accountNotFound"));
        }
        if (!json.email_sent) {
          throw new Error(t("errors.resetMailNotSent"));
        }
        markEmailSent("reset", email);
        return { ...json, email };
      }

      async function saveNewPassword() {
        const password = passEl.value;
        if (!password || password.length < 6)
          throw new Error(t("errors.passwordMin"));
        if (setupToken) {
          const resp = await fetch(`${FUNCTION_BASE}/auth-password-complete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: setupToken, password }),
          });
          const json = await resp.json().catch(() => ({}));
          if (!resp.ok)
            throw new Error(json.error || t("errors.passwordSetupFailed"));
          return;
        }
        throw new Error(t("errors.passwordLinkInvalid"));
      }

        } finally {
          setBusy(false);
        }
      };

      // Keep first interaction explicit to avoid showing premature pairing errors.
    </script>
