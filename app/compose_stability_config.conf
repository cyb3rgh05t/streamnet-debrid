// Compose Stability Configuration
// Marks domain model classes as stable to prevent unnecessary recompositions.
// See: https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file

// All domain model data classes - these are immutable (val-only) data holders
com.arflix.tv.data.model.*

// Standard library collections used in model fields
// (Kotlin List/Map/Set are interfaces, so Compose treats them as unstable by default)
kotlin.collections.*

// Live TV category tree: immutable, but the self-referencing List<LiveCategory> makes the compiler
// report it (and EnrichedChannels, which holds the tree) as unstable.
com.arflix.tv.ui.screens.tv.live.LiveCategory
com.arflix.tv.ui.screens.tv.live.LiveSection
com.arflix.tv.ui.screens.tv.live.LiveCategoryTree
com.arflix.tv.ui.screens.tv.live.EnrichedChannels

// Bitmaps held in UI state are never mutated after creation. Without this, AiKeyServerState and with
// it the whole SettingsUiState are unstable.
android.graphics.Bitmap
