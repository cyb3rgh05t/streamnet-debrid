<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord Authorization | StreamNet</title>
    <link rel="icon" href="/assets/streamnet-icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg-1: #0f0d0b;
        --bg-2: #171311;
        --bg-3: #221b16;
        --card: #1c1713;
        --panel: #15110e;
        --accent: #e5a209;
        --accent-2: #ce8017;
        --text: #f4efe7;
        --muted: #b4a798;
        --border: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 14% 4%,
            rgba(229, 162, 9, 0.12),
            transparent 26%
          ),
          linear-gradient(160deg, var(--bg-1), var(--bg-2) 62%, var(--bg-3));
        color: var(--text);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        text-align: center;
      }
      .page {
        width: min(100%, 500px);
      }
      .brand-logo {
        display: block;
        width: min(260px, 72vw);
        height: auto;
        margin: 0 auto 22px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 36px 28px;
        width: 100%;
        box-shadow: 0 28px 70px -34px rgba(0, 0, 0, 0.86);
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(229, 162, 9, 0.12);
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .icon svg {
        width: 32px;
        height: 32px;
        fill: currentColor;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .code-box {
        background: var(--panel);
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 12px;
        font-family: monospace;
        font-size: 15px;
        color: var(--accent);
        word-break: break-all;
        margin-bottom: 20px;
      }
      @media (max-width: 480px) {
        body {
          padding: 14px;
        }
        .brand-logo {
          width: 210px;
          margin-bottom: 16px;
        }
        .card {
          padding: 28px 18px;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a href="/">
        <img
          class="brand-logo"
          src="/assets/streamnet-club-logo.svg"
          alt="StreamNet Club"
        />
      </a>
      <div class="card" id="card">
        <div class="icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"
            />
          </svg>
        </div>
        <h1 id="heading">Connecting to TV...</h1>
        <p id="message">
          Please wait while we complete the authorization with your TV.
        </p>
        <div id="code-container" style="display: none">
          <p id="code-label" style="margin-bottom: 8px">Your pairing code:</p>
          <div class="code-box" id="code-val"></div>
        </div>
      </div>
    </main>

    <script src="/discord/callback.js"></script>
  </body>
</html>
