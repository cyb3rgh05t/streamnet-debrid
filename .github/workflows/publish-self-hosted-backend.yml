name: Publish Self-Hosted Backend

on:
  push:
    branches:
      - main
    paths:
      - "self-hosted-backend/**"
      - "netlify-auth-site/delete-account.html"
      - ".github/workflows/publish-self-hosted-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-self-hosted-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/cyb3rgh05t/streamnet-self-hosted-backend

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: self-hosted-backend/package-lock.json

      - name: Install and test
        working-directory: self-hosted-backend
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: self-hosted-backend/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
