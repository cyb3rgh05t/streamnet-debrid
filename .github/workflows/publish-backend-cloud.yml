name: Publish StreamNet Cloud Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend-cloud/**"
      - ".github/workflows/publish-backend-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-backend-cloud-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/cyb3rgh05t/streamnet-backend

jobs:
  version-check:
    name: Check backend version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare backend package version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(node -p "require('./backend-cloud/package.json').version")
          previous=""
          if [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            previous=$(git show "$BEFORE_SHA:backend-cloud/package.json" 2>/dev/null | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));" || true)
          fi

          if [[ -n "$previous" && "$current" != "$previous" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-cloud/package-lock.json

      - name: Install, validate and test
        working-directory: backend-cloud
        run: |
          npm ci
          node --check src/server.js
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend-cloud/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-telegram:
    name: Send backend changelog to Telegram
    needs: [version-check, publish]
    if: github.event_name == 'push' && needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Validate backend changelog
        id: backend_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./backend-cloud/package.json').version")
          grep -Eq "^## \[Backend $version\](\s+-.*)?$" CHANGELOG.md
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_TOPIC_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub secret: ${name}"
              exit 1
            fi
          done

      - name: Send German backend changelog to Telegram
        env:
          CHANGELOG_VERSION: Backend ${{ steps.backend_version.outputs.value }}
          CHANGELOG_TITLE: StreamNet Cloud Update
          CHANGELOG_FILE: CHANGELOG.md
          RELEASE_URL: https://github.com/${{ github.repository }}/pkgs/container/streamnet-backend
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          TELEGRAM_DRY_RUN: "false"
        run: python3 .github/scripts/send_telegram_changelog.py
