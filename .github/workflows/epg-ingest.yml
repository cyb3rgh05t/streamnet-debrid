name: EPG Ingest

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: epg-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Refresh backend EPG cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ingest worker scaffold
        env:
          SUPABASE_URL: ${{ secrets['SUPABASE_URL'] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets['SUPABASE_SERVICE_ROLE_KEY'] }}
          EPG_REFRESH_LIMIT: "20"
          EPG_CONCURRENCY: "2"
        run: |
          node tools/epg-ingest/ingest.mjs
