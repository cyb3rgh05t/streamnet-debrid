name: Publish StreamNet Web Player

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "resolver-worker/**"
      - ".github/workflows/publish-streamnet-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-streamnet-web-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/cyb3rgh05t/streamnet-web
  STREAMNET_BACKEND_URL: ${{ vars['STREAMNET_BACKEND_URL'] || 'https://auth.mystreamnet.club' }}
  STREAMNET_TV_XTREAM_URL: ${{ vars['STREAMNET_TV_XTREAM_URL'] || 'https://xui.streamnet.live' }}
  STREAMNET_RESOLVER_URL: ${{ vars['STREAMNET_RESOLVER_URL'] || 'https://resolve.streamnet.live' }}
  TRAKT_CLIENT_ID: ${{ vars['TRAKT_CLIENT_ID'] || secrets['TRAKT_CLIENT_ID'] || '' }}
  WEB_BUILD_STAMP: ${{ github.run_started_at }}

jobs:
  version-check:
    name: Check web version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare web package version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current=$(node -p "require('./web/package.json').version")
          previous=""
          if [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            previous=$(git show "$BEFORE_SHA:web/package.json" 2>/dev/null | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));" || true)
          fi

          echo "current_version=${current}"
          echo "previous_version=${previous:-<not found>}"

          if [[ -n "$previous" && "$current" != "$previous" ]]; then
            echo "Web version changed: ${previous} -> ${current}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Web version unchanged; skipping build and Telegram notification."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-resolver:
    name: Deploy media resolver
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resolver-worker/package-lock.json

      - name: Install dependencies
        working-directory: resolver-worker
        run: npm ci

      - name: Type-check worker
        working-directory: resolver-worker
        run: npm run typecheck

      - name: Deploy worker
        working-directory: resolver-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify resolver
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "${{ env.STREAMNET_RESOLVER_URL }}/health"

  validate:
    name: Validate web build
    needs: deploy-resolver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Extract APK version
        id: apk_version
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Next app
        working-directory: web
        env:
          NEXT_PUBLIC_SELF_HOSTED: "true"
          STREAMNET_BACKEND_URL: ${{ env.STREAMNET_BACKEND_URL }}
          NEXT_PUBLIC_STREAMNET_TV_XTREAM_URL: ${{ env.STREAMNET_TV_XTREAM_URL }}
          NEXT_PUBLIC_STREAMNET_MEDIA_RESOLVER_URL: ${{ env.STREAMNET_RESOLVER_URL }}
          NEXT_PUBLIC_TRAKT_CLIENT_ID: ${{ env.TRAKT_CLIENT_ID }}
          NEXT_PUBLIC_BUILD_STAMP: ${{ env.WEB_BUILD_STAMP }}
          NEXT_PUBLIC_APK_VERSION: ${{ steps.apk_version.outputs.value }}
        run: npm run build

  publish:
    name: Publish container image
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract APK version
        id: apk_version
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SELF_HOSTED=true
            NEXT_TELEMETRY_DISABLED=1
            STREAMNET_BACKEND_URL=${{ env.STREAMNET_BACKEND_URL }}
            NEXT_PUBLIC_STREAMNET_TV_XTREAM_URL=${{ env.STREAMNET_TV_XTREAM_URL }}
            NEXT_PUBLIC_TRAKT_CLIENT_ID=${{ env.TRAKT_CLIENT_ID }}
            NEXT_PUBLIC_BUILD_STAMP=${{ env.WEB_BUILD_STAMP }}
            NEXT_PUBLIC_STREAMNET_MEDIA_RESOLVER_URL=${{ env.STREAMNET_RESOLVER_URL }}
            NEXT_PUBLIC_APK_VERSION=${{ steps.apk_version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-telegram:
    name: Send web changelog to Telegram
    needs: publish
    if: github.event_name == 'push' && needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect new web version
        id: web_version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./web/package.json').version")
          previous=""
          if [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            previous=$(git show "$BEFORE_SHA:web/package.json" 2>/dev/null | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));" || true)
          fi

          if [[ -n "$previous" && "$current" != "$previous" ]]; then
            if ! grep -Eq "^## \[Web ${current}\](\s+-.*)?$" CHANGELOG.md; then
              echo "No changelog heading found for version ${current} in CHANGELOG.md"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "value=$current" >> "$GITHUB_OUTPUT"
            echo "Telegram notification enabled for new web version ${current}"
          else
            echo "Telegram notification skipped: previous version missing or unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Telegram secrets
        if: steps.web_version.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_TOPIC_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub secret: ${name}"
              exit 1
            fi
          done
          echo "Telegram secrets configured successfully."

      - name: Send German web changelog to Telegram
        if: steps.web_version.outputs.changed == 'true'
        env:
          CHANGELOG_VERSION: Web ${{ steps.web_version.outputs.value }}
          CHANGELOG_TITLE: StreamNet Web Update
          CHANGELOG_FILE: CHANGELOG.md
          RELEASE_URL: https://github.com/${{ github.repository }}/tree/web-${{ steps.web_version.outputs.value }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          TELEGRAM_DRY_RUN: "false"
        run: python3 .github/scripts/send_telegram_changelog.py
