name: Publish StreamNet Web Player

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "resolver-worker/**"
      - ".github/workflows/publish-streamnet-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-streamnet-web-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/cyb3rgh05t/streamnet-web
  STREAMNET_BACKEND_URL: ${{ vars['STREAMNET_BACKEND_URL'] || 'https://auth.mystreamnet.club' }}
  STREAMNET_TV_XTREAM_URL: ${{ vars['STREAMNET_TV_XTREAM_URL'] || 'https://xui.streamnet.live' }}
  STREAMNET_RESOLVER_URL: ${{ vars['STREAMNET_RESOLVER_URL'] || 'https://resolve.streamnet.live' }}

jobs:
  deploy-resolver:
    name: Deploy media resolver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resolver-worker/package-lock.json

      - name: Install dependencies
        working-directory: resolver-worker
        run: npm ci

      - name: Type-check worker
        working-directory: resolver-worker
        run: npm run typecheck

      - name: Deploy worker
        working-directory: resolver-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify resolver
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "${{ env.STREAMNET_RESOLVER_URL }}/health"

  validate:
    name: Validate web build
    needs: deploy-resolver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Next app
        working-directory: web
        env:
          NEXT_PUBLIC_SELF_HOSTED: "true"
          STREAMNET_BACKEND_URL: ${{ env.STREAMNET_BACKEND_URL }}
          NEXT_PUBLIC_STREAMNET_TV_XTREAM_URL: ${{ env.STREAMNET_TV_XTREAM_URL }}
          NEXT_PUBLIC_STREAMNET_MEDIA_RESOLVER_URL: ${{ env.STREAMNET_RESOLVER_URL }}
        run: npm run build

  publish:
    name: Publish container image
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SELF_HOSTED=true
            NEXT_TELEMETRY_DISABLED=1
            STREAMNET_BACKEND_URL=${{ env.STREAMNET_BACKEND_URL }}
            NEXT_PUBLIC_STREAMNET_TV_XTREAM_URL=${{ env.STREAMNET_TV_XTREAM_URL }}
            NEXT_PUBLIC_STREAMNET_MEDIA_RESOLVER_URL=${{ env.STREAMNET_RESOLVER_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
