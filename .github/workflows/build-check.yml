name: Android Build

on:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Check Android version change
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare versionCode and versionName
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read_versions() {
            grep -E '^[[:space:]]*version(Code|Name)[[:space:]]*=' \
              | sed -E 's/^[[:space:]]+//'
          }

          previous="$(git show "$BEFORE_SHA:app/build.gradle.kts" | read_versions)"
          current="$(read_versions < app/build.gradle.kts)"

          test "$(printf '%s\n' "$current" | grep -c .)" -eq 2
          if [ "$previous" != "$current" ]; then
            echo "Android version changed:"
            printf '%s\n' "$previous" "$current"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "versionCode and versionName are unchanged; skipping Android build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify build
    needs: version-check
    if: needs.version-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare placeholder build configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Compile and test
        run: ./gradlew test :app:compileSideloadDebugKotlin --no-daemon --stacktrace

  signed-apk:
    name: Build signed release APK
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate private Discord SDK download
        env:
          DISCORD_PARTNER_SDK_URL: ${{ secrets.DISCORD_PARTNER_SDK_URL }}
        run: |
          : "${DISCORD_PARTNER_SDK_URL:?Missing DISCORD_PARTNER_SDK_URL repository secret}"
          case "$DISCORD_PARTNER_SDK_URL" in
            https://*) ;;
            *) echo "DISCORD_PARTNER_SDK_URL must be an HTTPS URL" >&2; exit 1 ;;
          esac

      - name: Install Discord Partner SDK
        env:
          DISCORD_PARTNER_SDK_URL: ${{ secrets.DISCORD_PARTNER_SDK_URL }}
          DISCORD_PARTNER_SDK_BEARER_TOKEN: ${{ secrets.DISCORD_PARTNER_SDK_BEARER_TOKEN }}
          DISCORD_PARTNER_SDK_AAR_SHA256: ${{ secrets.DISCORD_PARTNER_SDK_AAR_SHA256 }}
        run: |
          install -d app/libs
          sdk_url="${DISCORD_PARTNER_SDK_URL%%\?*}"
          if [[ "$sdk_url" =~ ^https://github.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(.+)$ ]]; then
            : "${DISCORD_PARTNER_SDK_BEARER_TOKEN:?DISCORD_PARTNER_SDK_BEARER_TOKEN is required for private GitHub release assets}"
            export GH_TOKEN="$DISCORD_PARTNER_SDK_BEARER_TOKEN"
            sdk_repo="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            sdk_tag="${BASH_REMATCH[3]}"
            sdk_asset="${BASH_REMATCH[4]}"
            gh release download "$sdk_tag" \
              --repo "$sdk_repo" \
              --pattern "$sdk_asset" \
              --dir app/libs \
              --clobber
            if [ "app/libs/$sdk_asset" != "app/libs/discord_partner_sdk.aar" ]; then
              mv "app/libs/$sdk_asset" app/libs/discord_partner_sdk.aar
            fi
          elif [ -n "${DISCORD_PARTNER_SDK_BEARER_TOKEN:-}" ]; then
            curl --fail --location --retry 3 --connect-timeout 20 \
              --header "Authorization: Bearer $DISCORD_PARTNER_SDK_BEARER_TOKEN" \
              "$DISCORD_PARTNER_SDK_URL" \
              --output app/libs/discord_partner_sdk.aar
          else
            curl --fail --location --retry 3 --connect-timeout 20 \
              "$DISCORD_PARTNER_SDK_URL" \
              --output app/libs/discord_partner_sdk.aar
          fi
          test -s app/libs/discord_partner_sdk.aar
          chmod 0600 app/libs/discord_partner_sdk.aar
          if [ -n "${DISCORD_PARTNER_SDK_AAR_SHA256:-}" ]; then
            echo "$DISCORD_PARTNER_SDK_AAR_SHA256  app/libs/discord_partner_sdk.aar" | sha256sum --check --strict
          fi

      - name: Validate required credentials
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STREAMNET_TV_XTREAM_URL: ${{ secrets.STREAMNET_TV_XTREAM_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${TMDB_API_KEY:?Missing TMDB_API_KEY repository secret}"
          : "${TRAKT_CLIENT_ID:?Missing TRAKT_CLIENT_ID repository secret}"
          : "${TRAKT_CLIENT_SECRET:?Missing TRAKT_CLIENT_SECRET repository secret}"
          : "${DISCORD_CLIENT_ID:?Missing DISCORD_CLIENT_ID repository secret}"
          [[ "$DISCORD_CLIENT_ID" =~ ^[0-9]{17,20}$ ]] || { echo "DISCORD_CLIENT_ID must be a 17-20 digit Discord application id" >&2; exit 1; }
          : "${STREAMNET_TV_XTREAM_URL:?Missing STREAMNET_TV_XTREAM_URL repository secret}"
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS repository secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD repository secret}"

      - name: Prepare runtime configuration
        env:
          CLOUD_BACKEND_URL: https://auth.mystreamnet.club
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          VODWISHARR_API_KEY: ${{ secrets.VODWISHARR_API_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STREAMNET_TV_XTREAM_URL: ${{ secrets.STREAMNET_TV_XTREAM_URL }}
        run: |
          printf '%s\n' \
            "CLOUD_BACKEND_URL=$CLOUD_BACKEND_URL" \
            "SENTRY_DSN=${SENTRY_DSN:-disabled}" \
            "TMDB_API_KEY=$TMDB_API_KEY" \
            "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID" \
            "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET" \
            "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" \
            "TVDB_API_KEY=$TVDB_API_KEY" \
            "FANART_API_KEY=$FANART_API_KEY" \
            "VODWISHARR_API_KEY=$VODWISHARR_API_KEY" \
            "DISCORD_CLIENT_ID=$DISCORD_CLIENT_ID" \
            "STREAMNET_TV_XTREAM_URL=$STREAMNET_TV_XTREAM_URL" \
            > secrets.properties

      - name: Prepare production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/streamnet-release.keystore"
          printf '%s\n' \
            "storeFile=$GITHUB_WORKSPACE/streamnet-release.keystore" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:clean :app:assembleSideloadRelease --no-daemon --stacktrace

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          metadata="app/build/outputs/apk/sideload/release/output-metadata.json"
          test -f "$apk"
          test -f "$metadata"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"

          version_name="$(jq -er '.elements[0].versionName | select(type == "string" and length > 0)' "$metadata")"
          version_code="$(jq -er '.elements[0].versionCode | select(type == "number")' "$metadata")"
          artifact_name="StreamNet-Debrid-${version_name}.apk"
          mkdir -p release-artifacts
          cp "$apk" "release-artifacts/$artifact_name"
          (
            cd release-artifacts
            sha256sum "$artifact_name" > "$artifact_name.sha256"
          )

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Signed Android release"
            echo "- Version: $version_name ($version_code)"
            echo "- APK: $artifact_name"
            echo "- SHA-256: $(cut -d ' ' -f 1 "release-artifacts/$artifact_name.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: streamnet-sideload-${{ steps.package.outputs.version_name }}-${{ github.run_number }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Prepare German release notes
        env:
          CHANGELOG_VERSION: ${{ steps.package.outputs.version_name }}
          CHANGELOG_FILE: CHANGELOG.md
          CHANGELOG_OUTPUT_FILE: release-notes.md
          TELEGRAM_SKIP_SEND: "true"
        run: python3 .github/scripts/send_telegram_changelog.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${VERSION_NAME}"
          test -s release-notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-artifacts/* --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" release-artifacts/* \
              --target "$GITHUB_SHA" \
              --title "StreamNet Debrid ${VERSION_NAME}" \
              --notes-file release-notes.md
          fi

      - name: Send German changelog to Telegram
        env:
          CHANGELOG_VERSION: ${{ steps.package.outputs.version_name }}
          CHANGELOG_TITLE: StreamNet Update
          CHANGELOG_FILE: CHANGELOG.md
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.package.outputs.version_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          TELEGRAM_DRY_RUN: "false"
        run: python3 .github/scripts/send_telegram_changelog.py
