name: Android Build

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "secrets.defaults.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare placeholder build configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Compile and test
        run: ./gradlew test :app:compileSideloadDebugKotlin --no-daemon --stacktrace

  signed-apk:
    name: Build signed release APK
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate required credentials
        env:
          APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
          NETLIFY_BACKEND_URL: ${{ secrets.NETLIFY_BACKEND_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${APP_ANON_KEY:?Missing APP_ANON_KEY repository secret}"
          : "${NETLIFY_BACKEND_URL:?Missing NETLIFY_BACKEND_URL repository secret}"
          case "$NETLIFY_BACKEND_URL" in
            http://*|https://*) ;;
            *) echo "NETLIFY_BACKEND_URL must be an HTTP(S) URL" >&2; exit 1 ;;
          esac
          : "${SUPABASE_URL:?Missing SUPABASE_URL repository secret}"
          case "$SUPABASE_URL" in
            http://*|https://*) ;;
            *) echo "SUPABASE_URL must be an HTTP(S) URL" >&2; exit 1 ;;
          esac
          : "${TMDB_API_KEY:?Missing TMDB_API_KEY repository secret}"
          : "${TRAKT_CLIENT_ID:?Missing TRAKT_CLIENT_ID repository secret}"
          : "${TRAKT_CLIENT_SECRET:?Missing TRAKT_CLIENT_SECRET repository secret}"
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS repository secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD repository secret}"

      - name: Prepare runtime configuration
        env:
          APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
          NETLIFY_BACKEND_URL: ${{ secrets.NETLIFY_BACKEND_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          VODWISHARR_API_KEY: ${{ secrets.VODWISHARR_API_KEY }}
        run: |
          printf '%s\n' \
            "APP_ANON_KEY=$APP_ANON_KEY" \
            "NETLIFY_BACKEND_URL=$NETLIFY_BACKEND_URL" \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" \
            "SENTRY_DSN=${SENTRY_DSN:-disabled}" \
            "TMDB_API_KEY=$TMDB_API_KEY" \
            "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID" \
            "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET" \
            "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" \
            "TVDB_API_KEY=$TVDB_API_KEY" \
            "FANART_API_KEY=$FANART_API_KEY" \
            "VODWISHARR_API_KEY=$VODWISHARR_API_KEY" \
            > secrets.properties

      - name: Prepare production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/arvio-release.keystore"
          printf '%s\n' \
            "storeFile=$GITHUB_WORKSPACE/arvio-release.keystore" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:clean :app:assembleSideloadRelease --no-daemon --stacktrace

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          metadata="app/build/outputs/apk/sideload/release/output-metadata.json"
          test -f "$apk"
          test -f "$metadata"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"

          version_name="$(jq -er '.elements[0].versionName | select(type == "string" and length > 0)' "$metadata")"
          version_code="$(jq -er '.elements[0].versionCode | select(type == "number")' "$metadata")"
          artifact_name="StreamNet-Debrid-${version_name}.apk"
          mkdir -p release-artifacts
          cp "$apk" "release-artifacts/$artifact_name"
          (
            cd release-artifacts
            sha256sum "$artifact_name" > "$artifact_name.sha256"
          )

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Signed Android release"
            echo "- Version: $version_name ($version_code)"
            echo "- APK: $artifact_name"
            echo "- SHA-256: $(cut -d ' ' -f 1 "release-artifacts/$artifact_name.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: streamnet-sideload-${{ steps.package.outputs.version_name }}-${{ github.run_number }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${VERSION_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-artifacts/* --clobber
          else
            gh release create "$tag" release-artifacts/* \
              --target "$GITHUB_SHA" \
              --title "StreamNet Debrid ${VERSION_NAME}" \
              --generate-notes
          fi
