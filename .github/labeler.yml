# Config for actions/labeler v5
"area: android":
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"
          - "gradle/**"
          - "build.gradle.kts"
          - "settings.gradle.kts"

"area: auth-site":
  - changed-files:
      - any-glob-to-any-file:
          - "self-hosted-backend/public/**"

"area: backend":
  - changed-files:
      - any-glob-to-any-file:
          - "self-hosted-backend/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".gitlab-ci.yml"

"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
