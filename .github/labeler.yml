# Config for actions/labeler v5
"area: android":
  - changed-files:
      - any-glob-to-any-file:
          - 'app/**'
          - 'benchmark/**'
          - 'gradle/**'
          - 'build.gradle.kts'
          - 'settings.gradle.kts'

"area: ios":
  - changed-files:
      - any-glob-to-any-file:
          - 'iosApp/**'

"area: web":
  - changed-files:
      - any-glob-to-any-file:
          - 'web/**'
          - 'netlify-arvio-tv-site/**'
          - 'netlify-auth-site/**'

"area: backend":
  - changed-files:
      - any-glob-to-any-file:
          - 'supabase/**'
          - 'resolver-worker/**'

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.gitlab-ci.yml'

"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'
